<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>HTML/CSS レイアウト チュートリアル</title>
    <script>
      // SPA フォールバック: サブパスへ直接アクセス/リロードされた場合に
      // 現在のパスをクエリに退避して index.html へリダイレクトする。
      // segmentCount = 1 はリポジトリ名 (/html_tutorials/) を維持するため。
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + segmentCount)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(segmentCount)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
